name: Deploy plugin library

on:
  push:
    branches: [main]
    paths:
      - members.json
      - editions/library/**
      - scripts/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build library page
        run: ./scripts/build-library.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: editions/library/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
